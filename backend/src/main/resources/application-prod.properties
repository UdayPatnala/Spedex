# ── Production Spring Profile: Render / Managed PostgreSQL ──
server.port=${PORT:8080}

# Datasource: PostgreSQL if provided via DATABASE_URL/SPRING_DATASOURCE_URL, else graceful file-based H2 fallback
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:file:/tmp/spedex_prod_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# ── Connection Pool Optimization & Failover Resilience for Production (P1.1) ──
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.leak-detection-threshold=60000

# ── Cryptographic Security ──
# Production JWT Secret: externalized via JWT_SECRET with fallback for container survival
spedex.jwt.secret=${JWT_SECRET:default_prod_jwt_secret_that_is_at_least_256_bits_long_render}

# ── CORS ──
spedex.cors.allowed-origins=${SPEDEX_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://spedex.vercel.app,https://spe-dex.vercel.app,https://aos-spedex.vercel.app}
