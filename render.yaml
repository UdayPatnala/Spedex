services:
  - type: web
    name: spedex-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: SPEDEX_CORS_ALLOWED_ORIGINS
        value: https://spedex.vercel.app,https://spe-dex.vercel.app,http://localhost:5173
